name: Repository checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, arena/d7c9058c-gemsdoe69]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install CPU test environment
        run: python -m pip install -r requirements-dev.txt
      - name: Test literal gates, source parsing, geometry and pinned shared tools
        run: python -m pytest -q
      - name: Re-open archived TIFF variants (format only)
        run: >-
          python scripts/validate_submission.py
          submissions/h69-efg-kinematic-geodesic-29027-zeros.tif
          submissions/h69-efg-kinematic-geodesic-29027-nan.tif
          submissions/h69-joint-relayramp-pullapart-38669-20261020T201504Z-f29b6df5-zeros.tif
          submissions/h69-joint-relayramp-pullapart-38669-20261020T201504Z-f29b6df5-nan.tif
      - name: Regenerate the policy-controlled static site
        run: |
          python scripts/build_site69.py
          python scripts/build_readme.py
          python scripts/check_site.py
